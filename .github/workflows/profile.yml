name: Update profile README

on:
  schedule:
    - cron: "17 9 * * *" # daily, ~4am New York
  push:
    branches: [main]
    paths-ignore: ["profile-3d-contrib/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3D contribution calendar -> profile-3d-contrib/*.svg
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # "Currently building" + "last run" sections
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_readme.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md profile-3d-contrib/
          git diff --cached --quiet || git commit -m "Update profile README"
          git push

      # "Recent activity" section (commits and pushes on its own)
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          GH_USERNAME: ${{ github.repository_owner }}
          MAX_LINES: 5
          COMMIT_MSG: "Update recent activity"
